# Description:
# Thin caller for the shared datasource CI/CD pipeline in
# grafana/data-sources-ci-workflows, which owns release-please and the prod publish.
#
# CI is called directly rather than through the shared workflow. A called workflow
# prefixes its checks with the calling job's name, so routing CI through
# datasource-cicd.yml reports every check as "CI/CD / CI / <job>" instead of
# "CI / <job>". This repo's branch rulesets require "CI / Test and build plugin"
# and "CI / Test docs", so the deeper names would leave the required checks
# permanently unreported and block every PR.
#
# The dev-catalog publish is also a direct cd-dev.yml call, so the
# reusable-workflow chain stays within GitHub's 4-level nesting cap. It is gated on
# the shared workflow's release_created output so a Release Please merge (which
# cicd publishes to prod) does not also double-publish to the dev catalog.

name: Plugins - CI/CD

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  # Supersede an in-flight run on the same ref, except on main. A main run can be
  # publishing to the dev catalog or cutting a release, so it must never be cancelled.
  group: plugins-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ci:
    name: CI
    if: github.event_name == 'pull_request'
    uses: grafana/plugin-ci-workflows/.github/workflows/ci.yml@ci-cd-workflows/v10.1.0
    permissions:
      contents: read
      id-token: write
    with:
      # Ensure PR builds produce unique plugin versions.
      plugin-version-suffix: ${{ github.event.pull_request.head.sha }}
      run-playwright: true
      # TruffleHog's SentryToken detector false-positives on this plugin's signed
      # build output (#717). Unchanged from before this workflow was restructured.
      run-trufflehog: false

  cicd:
    name: CI/CD
    # Release path only. On pull requests every job in the shared workflow is
    # skipped, so CI above is the only pull-request path.
    if: github.ref == 'refs/heads/main'
    # Intentionally pinned to @main: data-sources-ci-workflows publishes no
    # versioned tags for datasource-cicd.yml yet. Allowed by the zizmor policy
    # (`grafana/*: any`); review periodically.
    uses: grafana/data-sources-ci-workflows/.github/workflows/datasource-cicd.yml@main
    # These are a ceiling for the called workflow, not a grant to each of its jobs.
    # Every job there declares its own permissions, which cannot exceed this block.
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    secrets: inherit

  publish-dev:
    name: Publish to Dev Catalog and Deploy
    needs: cicd
    # Publishes each main build to the internal dev Plugin Catalog and deploys it.
    # Skipped when release-please cut a release, because cicd already published
    # that version to the prod catalog.
    if: github.ref == 'refs/heads/main' && needs.cicd.outputs.release_created != 'true'
    # Intentionally pinned to @main: see the note on cicd above.
    uses: grafana/data-sources-ci-workflows/.github/workflows/cd-dev.yml@main
    permissions:
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    with:
      go-version: "1.26.3"
      golangci-lint-version: "2.10.1"
